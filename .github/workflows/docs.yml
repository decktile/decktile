name: docs

# Build the Sphinx docs and publish them to https://decktile.github.io/decktile/
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version comes from git tags
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build docs
        run: uv run --with sphinx --with furo --with myst-parser sphinx-build -b html docs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
