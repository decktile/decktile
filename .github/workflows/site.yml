name: site

# Rebuild decktile.github.io when the example decks change.
on:
  push:
    branches: [master]
    paths: ["examples/**"]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - name: Skip without token
        if: env.SITE_DISPATCH_TOKEN == ''
        run: echo "::notice::SITE_DISPATCH_TOKEN not set, site rebuilds weekly instead"
      - name: Trigger site rebuild
        if: env.SITE_DISPATCH_TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/decktile/decktile.github.io/dispatches \
            -d '{"event_type":"examples-changed"}'
