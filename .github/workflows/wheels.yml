name: wheels

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Pango (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pango
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Install Pango (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-pango
          path-type: inherit
      - name: Point WeasyPrint at MSYS2 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "WEASYPRINT_DLL_DIRECTORIES=$(cygpath -w "${RUNNER_TEMP}/msys64/ucrt64/bin")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install wheel and build HTML + PDF
        shell: bash
        run: |
          uv venv
          uv pip install dist/*.whl
          rm -rf src
          uv run --no-project slidr --help
          uv run --no-project slidr -o out --pdf examples/features_demo.md
          ls out/*.html out/*.pdf

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Skip PyPI without token
        if: env.PYPI_API_TOKEN == ''
        run: echo "::notice::PYPI_API_TOKEN not set, skipping PyPI publish"
      - uses: astral-sh/setup-uv@v6
        if: env.PYPI_API_TOKEN != ''
      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        run: uv publish --token "$PYPI_API_TOKEN"
